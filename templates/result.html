<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Top Navigation Bar */
        .navbar {
            height: 60px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        
        .nav-title { 
            color: white; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .actions { display: flex; gap: 10px; }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-back { background: #334155; color: white; }
        .btn-back:hover { background: #475569; }

        .btn-download { background: #6366f1; color: white; }
        .btn-download:hover { background: #4f46e5; }

        /* The Preview Area */
        .preview-container {
            flex: 1;
            width: 100%;
            background: white;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Error State Styling */
        .error-message {
            display: none;
            color: #ef4444;
            padding: 20px;
            text-align: center;
            background: #0f172a;
            height: 100%;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="font-sans">

    <div class="navbar">
        <div class="nav-title">
            <div class="status-dot"></div> Live Preview
        </div>
        <div class="actions">
            <button class="btn-back" onclick="window.location.href='/'">← New Page</button>
            <button class="btn-download" onclick="downloadCode()">⬇ Download HTML</button>
        </div>
    </div>

    <div class="preview-container">
        <!-- Error Fallback -->
        <div id="error-msg" class="error-message">
            <h2>Generation Failed</h2>
            <p>No HTML code was received from the server.</p>
        </div>

        <!-- The Iframe -->
        <iframe id="preview-frame"></iframe>
    </div>

    <!-- 
       FIX: Use a TEXTAREA to store the code. 
       Textareas do not execute HTML, so the <script> tags inside 
       the generated code won't break this page.
    -->
    <textarea id="generated-code" style="display:none;">{{ html_code|safe }}</textarea>

    <script>
        const iframe = document.getElementById('preview-frame');
        const errorMsg = document.getElementById('error-msg');
        
        // Get the code from the textarea using .value
        let code = document.getElementById('generated-code').value.trim();

        // Check if code is valid HTML
        if (!code || code.length < 10 || !code.includes('<html')) {
            iframe.style.display = 'none';
            errorMsg.style.display = 'flex';
            console.error("Invalid or empty HTML generated:", code);
        } else {
            // Use srcdoc for better security and compatibility
            iframe.srcdoc = code;
        }

        // Define the function globally so the button can find it
        window.downloadCode = function() {
            if (!code || code.includes("Server Error") || code.includes("API Error") || code.includes("Generation Incomplete")) {
                alert("Cannot download: The generated code contains errors.");
                return;
            }

            const element = document.createElement('a');
            const file = new Blob([code], {type: 'text/html'});
            element.href = URL.createObjectURL(file);
            element.download = "my_landing_page.html";
            document.body.appendChild(element); // Required for this to work in FireFox
            element.click();
            document.body.removeChild(element);
        };
    </script>
</body>
</html>
