<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Landing Page Generator</title>
    <style>
        
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: #334155;
            --primary-gradient: linear-gradient(to right, #6366f1, #ec4899);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-label: #cbd5e1;
            --focus-color: #6366f1;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- 3. Card Container --- */
        .app-card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- 4. Header Section --- */
        .card-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card-header h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .card-header p { color: var(--text-muted); font-size: 14px; }

        /* --- 5. Form Elements --- */
        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-label);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--focus-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* File Input Specifics */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button {
            display: none; /* Hide default ugly button */
        }

        /* Hint Text */
        .input-hint {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            margin-left: 2px;
        }

        /* --- 6. Divider --- */
        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 24px 0;
            opacity: 0.5;
        }

        /* --- 7. Button --- */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary-gradient);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit.loading { opacity: 0.7; pointer-events: none; }

    </style>
</head>
<body>

    <main class="app-card">
        <header class="card-header">
            <h1>Generate Landing Page</h1>
            
        </header>

        <form method="POST" action="/generate/" enctype="multipart/form-data" id="generatorForm">
            {% csrf_token %}

            <!-- Logo Section -->
            <div class="form-group">
                <label class="form-label">Upload Your Logo</label>
                <input type="file" name="logo" accept="image/*">
                <span class="input-hint">Optional. We will place this in the header.</span>
            </div>

            <div class="divider"></div>

            <!-- Ad Inputs -->
            <div class="form-group">
                <label class="form-label">Ad Copy / Text</label>
                <textarea name="ad_text" rows="3" class="form-textarea" placeholder="E.g., 'Get 50% off shoes today!'"></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">Ad Creative Link</label>
                <input type="text" name="ad_link" class="form-input" placeholder="https://facebook.com/ads/...">
            </div>
            
            <div class="form-group">
                <label class="form-label">Upload Ad Image</label>
                <input type="file" name="ad_image" accept="image/*">
                <span class="input-hint">Use text, link, OR image (priority from top to bottom)</span>
            </div>

            <div class="divider"></div>

            <!-- Target URL -->
            <div class="form-group">
                <label class="form-label">Target Landing Page URL <span style="color:#ef4444">*</span></label>
                <input type="url" name="url" class="form-input" placeholder="https://competitor.com/landing" required>
            </div>

            <button type="submit" class="btn-submit" id="generateBtn">
                Generate Landing Page 
            </button>
        </form>
    </main>

    <script>
        const form = document.getElementById('generatorForm');
        const btn = document.getElementById('generateBtn');

        form.addEventListener('submit', function() {
            // Visual feedback only
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Generating Magic... ⏳';
            btn.classList.add('loading');
            
            // Optional: Reset if user hits back (simple logic)
            // In a real app, you might handle this differently
        });
    </script>

</body>
</html>
